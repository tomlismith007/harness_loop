<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop Harness · 真实流程图</title>
<style>
  :root{
    --bg:#0b0f0d; --panel:#121914; --line:#2b3830; --text:#ece7db; --muted:#a9b6ac;
    --amber:#e0a458; --sage:#93b8a6; --pass:#9ac474; --stop:#e59073; --wait:#e0ca84;
    --mono:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5}
  header{padding:34px 28px 18px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 6px;font-size:1.5rem;font-weight:650;letter-spacing:-.01em}
  header p{margin:0;color:var(--muted);font-size:.9rem;max-width:900px}
  .legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;font-size:.8rem;color:var(--muted)}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .k-mech{background:#22331f;border:1px solid #4c7a3d}
  .k-conv{background:#332d1a;border:1px solid #8a7434}
  .k-wire{background:#331f19;border:1px solid #8a4c3a}
  .k-term{background:#1b2620;border:1px solid #3f5a4c;border-radius:50%!important}
  .k-dec{background:#2a2418;border:1px solid #8a7434;transform:rotate(45deg)}
  main{padding:22px 28px 60px;overflow-x:auto}
  .diagram{min-width:1080px}
  figure{margin:0 0 46px}
  figcaption{font-family:var(--mono);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin:0 0 8px}
  svg{display:block;width:100%;height:auto;padding:10px;background:
    radial-gradient(600px 300px at 20% 0%,rgba(224,164,88,.05),transparent 60%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 1px,transparent 1px 32px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.014) 0 1px,transparent 1px 32px);
    border:1px solid var(--line);border-radius:12px}
  text{font-family:var(--sans);fill:var(--text)}
  .t-mono{font-family:var(--mono)}
  .t-small{font-size:12px;fill:var(--muted)}
  .t-tiny{font-size:12px;fill:#9aab9f}
  .t-title{font-size:13px;font-weight:600}
  .t-amber{fill:var(--amber)}
  .t-pass{fill:var(--pass)}
  .t-stop{fill:var(--stop)}
  .t-wait{fill:var(--wait)}
  .box{fill:#141c17;stroke:#3a4a40;stroke-width:1.2;rx:8}
  .box-mech{fill:#18251a;stroke:#4c7a3d}
  .box-conv{fill:#241f12;stroke:#8a7434}
  .box-wire{fill:#241512;stroke:#8a4c3a}
  .box-term{fill:#101a15;stroke:#3f5a4c;stroke-width:1.4}
  .box-dec{fill:#231d10;stroke:#8a7434;stroke-width:1.4}
  .box-esc{fill:#241512;stroke:#b0654a;stroke-width:1.4}
  .box-ok{fill:#18251a;stroke:#6d9a52;stroke-width:1.4}
  .edge{fill:none;stroke:#5a6b60;stroke-width:1.4;marker-end:url(#arrow)}
  .edge-esc{stroke:#b0654a;marker-end:url(#arrowEsc)}
  .edge-ok{stroke:#6d9a52;marker-end:url(#arrowOk)}
  .edge-wait{stroke:#a08a45;marker-end:url(#arrowWait);stroke-dasharray:5 4}
  .edge-loop{stroke:#7d8f84;marker-end:url(#arrow);stroke-dasharray:4 4}
  .lane{fill:#0e1511;stroke:#26332b;stroke-width:1}
  .lane-label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;fill:#93a59a;text-transform:uppercase}
  .lbl{font-size:12px;fill:#a9bbae;font-family:var(--mono)}
  .lbl-esc{fill:#d38a6f}
  .lbl-ok{fill:#9ac474}
  .lbl-wait{fill:#d8c078}
</style>
</head>
<body>
<header>
  <h1>Loop Harness 真实流程图</h1>
  <p>按 <code>scripts/</code> 与 <code>examples/github-actions/</code> 的实际代码绘制。方框 = 动作，菱形 = 判断，圆角胶囊 = 终止结局，红色 = 升级/停止，绿色 = 通过。</p>
  <div class="legend">
    <span><i class="k-mech"></i>机制（代码会拦）</span>
    <span><i class="k-conv"></i>约定（靠自觉）</span>
    <span><i class="k-wire"></i>未接线</span>
    <span><i class="k-dec"></i>判断</span>
    <span><i class="k-term"></i>终止</span>
  </div>
</header>
<main>
<div class="diagram">

<!-- ============================================================ 1 装配 -->
<figure>
  <figcaption>1 · 装配：空仓库 → 可运行（harness-stage.mjs）</figcaption>
  <svg viewBox="0 0 1180 470" role="img" aria-label="装配流程图">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6b60"/></marker>
      <marker id="arrowEsc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b0654a"/></marker>
      <marker id="arrowOk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d9a52"/></marker>
      <marker id="arrowWait" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a08a45"/></marker>
    </defs>

    <!-- lane -->
    <rect class="lane" x="20" y="24" width="1140" height="420" rx="10"/>
    <text class="lane-label" x="36" y="46">PACK REPOSITORY · 只在这里运行</text>

    <!-- start -->
    <rect class="box" x="70" y="66" width="210" height="52" rx="8"/>
    <text class="t-title" x="86" y="88">目标仓库路径</text>
    <text class="t-small" x="86" y="105">node scripts/harness-stage.mjs &lt;repo&gt;</text>

    <!-- detect -->
    <rect class="box box-mech" x="70" y="156" width="210" height="60" rx="8"/>
    <text class="t-title" x="86" y="178">① 检测当前阶段</text>
    <text class="t-small" x="86" y="195">loop-audit 评分 + 逐条判据</text>
    <text class="t-tiny" x="86" y="209">只读，不写文件</text>

    <!-- decision stage complete -->
    <polygon class="box-dec" points="470,150 560,196 470,242 380,196"/>
    <text class="t-title" x="470" y="191" text-anchor="middle">判据全过？</text>
    <text class="t-small" x="470" y="207" text-anchor="middle">--require</text>

    <!-- report -->
    <rect class="box" x="70" y="250" width="210" height="56" rx="8"/>
    <text class="t-title" x="86" y="272">输出阶段与差距</text>
    <text class="t-small" x="86" y="289">每条失败判据带补齐动作</text>

    <!-- upgrade -->
    <rect class="box box-mech" x="70" y="342" width="210" height="64" rx="8"/>
    <text class="t-title" x="86" y="364">② --upgrade --stage N</text>
    <text class="t-small" x="86" y="381">按阶段写文件 / 装技能</text>
    <text class="t-small" x="86" y="396">复制运行脚本 + workflow</text>

    <!-- decision skip -->
    <polygon class="box-dec" points="470,344 560,390 470,436 380,390"/>
    <text class="t-title" x="470" y="385" text-anchor="middle">跳级？</text>
    <text class="t-small" x="470" y="401" text-anchor="middle">stage N 而 N-1 未完成</text>

    <!-- reject -->
    <rect class="box-esc" x="660" y="330" width="200" height="60" rx="8"/>
    <text class="t-title t-stop" x="676" y="352">拒绝并退出 2</text>
    <text class="t-small" x="676" y="369">提示先跑 --stage N-1</text>
    <text class="t-tiny" x="676" y="383">--force 是显式逃生门</text>

    <!-- stage1 -->
    <rect class="box box-mech" x="660" y="66" width="220" height="92" rx="8"/>
    <text class="t-title" x="676" y="88">阶段 1 · 7 个文件</text>
    <text class="t-small" x="676" y="105">AGENTS / feature_list / progress</text>
    <text class="t-small" x="676" y="120">STATE / LESSONS / loop-constraints</text>
    <text class="t-small" x="676" y="135">+ 生成的 init.sh</text>
    <text class="t-tiny" x="676" y="150">+ 7 运行脚本 + 7 技能</text>

    <!-- stage2 -->
    <rect class="box box-mech" x="660" y="176" width="220" height="92" rx="8"/>
    <text class="t-title" x="676" y="198">阶段 2 · 5 个 loop 文档</text>
    <text class="t-small" x="676" y="215">LOOP / loop-budget / run-log</text>
    <text class="t-small" x="676" y="230">session-handoff / loop-ledger</text>
    <text class="t-tiny" x="676" y="245">+ loop-guard / minimal-fix / verifier</text>

    <!-- stage3 -->
    <rect class="box box-mech" x="660" y="286" width="220" height="92" rx="8"/>
    <text class="t-title" x="676" y="308">阶段 3 · 事件接线</text>
    <text class="t-small" x="676" y="325">复制 8 个 workflow 到</text>
    <text class="t-small" x="676" y="340">.github/workflows/</text>
    <text class="t-tiny" x="676" y="355">+ 4 个阶段 3 技能</text>

    <!-- verify -->
    <rect class="box box-ok" x="940" y="176" width="196" height="86" rx="8"/>
    <text class="t-title" x="956" y="198">③ 校验</text>
    <text class="t-small" x="956" y="215">--stage N --require</text>
    <text class="t-small" x="956" y="231">退出 0 = 达成</text>
    <text class="t-tiny" x="956" y="246">可直接做 CI 关卡</text>

    <!-- edges -->
    <path class="edge" d="M175,118 L175,156"/>
    <path class="edge" d="M280,186 L380,196"/>
    <text class="lbl" x="300" y="180">完成</text>
    <path class="edge" d="M470,242 L470,278 L280,278"/>
    <text class="lbl" x="480" y="260">未完成</text>
    <path class="edge" d="M175,306 L175,342"/>
    <path class="edge" d="M280,374 L380,390"/>
    <path class="edge-esc" d="M560,390 L660,360"/>
    <text class="lbl lbl-esc" x="580" y="376">是</text>
    <path class="edge" d="M470,344 L470,300 L470,278"/>
    <text class="lbl" x="478" y="322">否</text>
    <path class="edge" d="M470,196 L560,196 L660,140"/>
    <text class="lbl" x="572" y="168">阶段 1</text>
    <path class="edge" d="M560,196 L660,222"/>
    <text class="lbl" x="574" y="228">阶段 2</text>
    <path class="edge" d="M560,196 L660,332"/>
    <text class="lbl" x="574" y="316">阶段 3</text>
    <path class="edge-ok" d="M880,120 L940,190"/>
    <path class="edge-ok" d="M880,222 L940,222"/>
    <path class="edge-ok" d="M880,332 L940,262"/>
    <text class="lbl lbl-ok" x="900" y="300">校验</text>

    <!-- note -->
    <text class="t-tiny" x="940" y="300">消费者不装阶段驱动技能：</text>
    <text class="t-tiny" x="940" y="314">它们第一步调用 harness-stage.mjs，</text>
    <text class="t-tiny" x="940" y="328">而该脚本不复制进消费者。</text>
  </svg>
</figure>

<!-- ============================================================ 2 事件入口 -->
<figure>
  <figcaption>2 · 事件入口：一个 workflow 实际做什么</figcaption>
  <svg viewBox="0 0 1180 520" role="img" aria-label="事件入口流程图">
    <!-- lane -->
    <rect class="lane" x="20" y="24" width="700" height="470" rx="10"/>
    <text class="lane-label" x="36" y="46">GITHUB ACTIONS RUNNER</text>
    <rect class="lane" x="740" y="24" width="420" height="470" rx="10"/>
    <text class="lane-label" x="756" y="46">EXTERNAL · 本包不含</text>

    <!-- event -->
    <rect class="box" x="60" y="66" width="230" height="54" rx="8"/>
    <text class="t-title" x="76" y="88">仓库事件到达</text>
    <text class="t-small" x="76" y="105">issues / PR / CI / tag / schedule</text>

    <!-- sanitize -->
    <rect class="box box-mech" x="60" y="150" width="230" height="62" rx="8"/>
    <text class="t-title" x="76" y="172">确定事件名与 item</text>
    <text class="t-small" x="76" y="189">事件字段经 env: 传入</text>
    <text class="t-small" x="76" y="204">tr -c 消毒，绝不拼进 run:</text>

    <!-- budget -->
    <rect class="box box-mech" x="60" y="242" width="230" height="58" rx="8"/>
    <text class="t-title" x="76" y="264">预算 + kill switch</text>
    <text class="t-small" x="76" y="281">budget-check --pattern &lt;id&gt;</text>

    <!-- dec budget -->
    <polygon class="box-dec" points="440,238 512,271 440,304 368,271"/>
    <text class="t-small" x="440" y="268" text-anchor="middle">mode?</text>
    <text class="t-tiny" x="440" y="282" text-anchor="middle">exit</text>

    <!-- stop -->
    <rect class="box-esc" x="60" y="330" width="230" height="52" rx="8"/>
    <text class="t-title t-stop" x="76" y="352">job 失败退出</text>
    <text class="t-small" x="76" y="369">fail-closed：读不到也退出</text>

    <!-- route -->
    <rect class="box box-mech" x="368" y="150" width="290" height="62" rx="8"/>
    <text class="t-title" x="384" y="172">event-router.mjs</text>
    <text class="t-small" x="384" y="189">--event &lt;e&gt; --item &lt;i&gt; --target &lt;branch|pr&gt;</text>
    <text class="t-small" x="384" y="204">→ route.json: phase / skills / gates</text>

    <!-- dec lock -->
    <polygon class="box-dec" points="513,238 585,271 513,304 441,271"/>
    <text class="t-small" x="513" y="268" text-anchor="middle">conflict?</text>
    <text class="t-tiny" x="513" y="282" text-anchor="middle">lock-held</text>

    <!-- skip -->
    <rect class="box-conv" x="368" y="330" width="290" height="52" rx="8"/>
    <text class="t-title t-wait" x="384" y="352">跳过本轮 · outcome=no-op</text>
    <text class="t-small" x="384" y="369">不写队列；锁被别的循环持有</text>

    <!-- write -->
    <rect class="box box-mech" x="60" y="404" width="290" height="62" rx="8"/>
    <text class="t-title" x="76" y="426">写 work item</text>
    <text class="t-small" x="76" y="443">.loop/queue/&lt;item&gt;.json</text>
    <text class="t-small" x="76" y="458">id / event / phase / branch / sha</text>

    <!-- upload -->
    <rect class="box box-mech" x="390" y="404" width="268" height="62" rx="8"/>
    <text class="t-title" x="406" y="426">upload-artifact</text>
    <text class="t-small" x="406" y="443">runner 文件系统是临时的</text>
    <text class="t-small" x="406" y="458">不上传就随 job 消失</text>

    <!-- external -->
    <rect class="box box-wire" x="780" y="150" width="340" height="90" rx="8"/>
    <text class="t-title t-stop" x="796" y="172">agent 平台消费队列</text>
    <text class="t-small" x="796" y="189">读 artifact / 评论 / dispatch</text>
    <text class="t-small" x="796" y="204">启动执行者与验证者</text>
    <text class="t-tiny" x="796" y="221">本包不含运行器；未接时止于 fix-proposed</text>

    <rect class="box box-wire" x="780" y="280" width="340" height="80" rx="8"/>
    <text class="t-title t-stop" x="796" y="302">没有平台时</text>
    <text class="t-small" x="796" y="319">循环停在 fix-proposed</text>
    <text class="t-small" x="796" y="334">这是合法结局，不是失败</text>

    <!-- edges -->
    <path class="edge" d="M175,120 L175,150"/>
    <path class="edge" d="M175,212 L175,242"/>
    <path class="edge" d="M290,271 L368,271"/>
    <path class="edge-esc" d="M368,271 L290,340"/>
    <text class="lbl lbl-esc" x="300" y="300">exit</text>
    <path class="edge" d="M290,285 L290,330 L290,404"/>
    <text class="lbl" x="296" y="390">normal</text>
    <path class="edge" d="M440,238 L440,212"/>
    <text class="lbl" x="446" y="226">ok</text>
    <path class="edge" d="M513,304 L513,330"/>
    <path class="edge-esc" d="M585,271 L658,271 L658,340 L658,340"/>
    <text class="lbl lbl-esc" x="596" y="260">lock-held</text>
    <path class="edge" d="M658,271 L658,290 L658,330"/>
    <path class="edge" d="M513,304 L513,330 L513,404"/>
    <path class="edge" d="M350,435 L390,435"/>
    <path class="edge-wait" d="M658,435 L780,240"/>
    <text class="lbl lbl-wait" x="668" y="420">交付</text>
  </svg>
</figure>

<!-- ============================================================ 3 运行时 -->
<figure>
  <figcaption>3 · 运行时主循环：harness-loop 的 8 步与全部退出点</figcaption>
  <svg viewBox="0 0 1180 900" role="img" aria-label="运行时主循环流程图">
    <defs>
      <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6b60"/></marker>
      <marker id="a2e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b0654a"/></marker>
      <marker id="a2o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d9a52"/></marker>
    </defs>

    <!-- start -->
    <rect class="box box-term" x="60" y="40" width="240" height="50" rx="25"/>
    <text class="t-title" x="180" y="62" text-anchor="middle">事件到达 · 开始一轮</text>
    <text class="t-small" x="180" y="78" text-anchor="middle">一轮只处理一个 work item</text>

    <!-- step 0 -->
    <rect class="box box-mech" x="60" y="124" width="240" height="60" rx="8"/>
    <text class="t-title" x="76" y="146">第 0 步 · 退出检查</text>
    <text class="t-small" x="76" y="163">暂停/预算 → 接线 → 待办</text>
    <text class="t-tiny" x="76" y="177">成本最低，先做</text>

    <polygon class="box-dec" points="400,118 470,154 400,190 330,154"/>
    <text class="t-small" x="400" y="151" text-anchor="middle">任一命中？</text>

    <rect class="box-esc" x="560" y="110" width="210" height="46" rx="8"/>
    <text class="t-title t-stop" x="576" y="130">立即退出</text>
    <text class="t-small" x="576" y="147">exit / no-wiring / no-op</text>

    <!-- step 1 -->
    <rect class="box box-conv" x="60" y="216" width="240" height="56" rx="8"/>
    <text class="t-title" x="76" y="238">第 1 步 · 加载约束</text>
    <text class="t-small" x="76" y="255">loop-constraints.md · N rules</text>

    <!-- step 2 -->
    <rect class="box box-mech" x="60" y="304" width="240" height="60" rx="8"/>
    <text class="t-title" x="76" y="326">第 2 步 · 路由事件</text>
    <text class="t-small" x="76" y="343">event-router --target 不可省</text>
    <text class="t-tiny" x="76" y="357">省掉 → 锁静默失效</text>

    <polygon class="box-dec" points="400,298 470,334 400,370 330,334"/>
    <text class="t-small" x="400" y="331" text-anchor="middle">lock-held？</text>

    <rect class="box-conv" x="560" y="290" width="210" height="46" rx="8"/>
    <text class="t-title t-wait" x="576" y="310">跳过 · no-op</text>
    <text class="t-small" x="576" y="327">记录原因 lock-held</text>

    <!-- step 3 -->
    <rect class="box box-mech" x="60" y="392" width="240" height="56" rx="8"/>
    <text class="t-title" x="76" y="414">第 3 步 · 取得锁</text>
    <text class="t-small" x="76" y="431">写 acting_on = branch / PR</text>

    <!-- step 4 -->
    <rect class="box box-mech" x="60" y="478" width="240" height="56" rx="8"/>
    <text class="t-title" x="76" y="500">第 4 步 · 预算分级</text>
    <text class="t-small" x="76" y="517">≥80% → report-only</text>

    <!-- step 5 -->
    <rect class="box box-conv" x="60" y="564" width="240" height="70" rx="8"/>
    <text class="t-title" x="76" y="586">第 5 步 · 派发技能</text>
    <text class="t-small" x="76" y="603">triage → minimal-fix</text>
    <text class="t-small" x="76" y="618">→ 独立实例 loop-verifier</text>
    <text class="t-tiny" x="76" y="630">改动必须在独立 worktree</text>

    <!-- step 6 -->

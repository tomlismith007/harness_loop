name: Self-check

# loop-harness 自身的验证关卡。
# 每次 push / PR 运行测试套件与 CLI 冒烟。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 三个平台都跑：测试套件曾经用 POSIX 的 true/false 当夹具，
    # 在 Windows 上必红，而 CI 只在 ubuntu 上跑，红了一年没人看见。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run test suite
        run: node scripts/test.mjs

      - name: Untrusted-input sanitizer self-test
        run: node skills/harness-loop-issue/scripts/state-write.mjs --self-test

      - name: CLI entry points respond
        shell: bash
        run: |
          set -e
          # 装配器在一个空目录上实跑阶段 1：这是它唯一的真实入口。
          T="$(mktemp -d)"
          printf '{"name":"x","scripts":{"test":"echo ok"}}\n' > "$T/package.json"
          node skills/harness-init/scripts/harness-stage.mjs "$T" --upgrade --stage 1 > /dev/null
          test -f "$T/AGENTS.md"
          test -f "$T/init.sh"
          node scripts/install-skills.mjs --target . --list > /dev/null
          echo "All CLI entry points respond."

      - name: Check for credential literals
        # 同上：PowerShell 不认 bash 的 if/grep 语法。
        shell: bash
        run: |
          # 源码与示例中不得出现可用的凭据字面量
          if grep -rEn "(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})" \
              --include="*.mjs" --include="*.yml" --include="*.md" --include="*.json" \
              scripts/ templates/ skills/ docs/ 2>/dev/null; then
            echo "::error::Possible credential literal found"
            exit 1
          fi
          echo "No credential literals found."

name: Loop — Release Draft

# 标签 / 发布事件 → release 阶段。只起草，不发布、不打标签。

on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: loop-release
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Budget & kill switch
        id: budget
        run: |
          set -euo pipefail
          # 预算与 kill switch 的唯一入口（scripts/budget-check.mjs）。
          # 每个循环有自己的上限（loop-budget.md），按 pattern 取——曾经用
          # Math.max(...caps) 取全表最大值，于是所有循环共用 CI Sweeper 的 500k，
          # 本循环花掉自身 83% 时被算成 50%，判定"正常"。
          #
          # 注意本 workflow 不写 loop-run-log.md，而那是 budget-check 的唯一数据源，
          # 所以 used 目前恒为 0——预算百分比要等 agent 平台把真实花费写进 run-log
          # 才有意义。这里接线的主要收益是 **kill switch**（那部分是立即生效的）。
          node scripts/budget-check.mjs --pattern release-drafter --json > budget.json || true
          cat budget.json
          # fail-closed：脚本崩溃时 budget.json 是空的，jq 得到 "null"，
          # 而 "null" != "exit" —— 循环会在没有预算检查的情况下继续跑。
          # 一个失效的闸门和一个不存在的闸门在退出码上不可区分，所以显式拒绝。
          if ! jq -e '.mode' budget.json > /dev/null 2>&1; then
            echo "::error::budget-check produced no usable result — refusing to run unguarded"
            exit 1
          fi
          MODE=$(jq -r '.mode' budget.json)
          REASON=$(jq -r '.reason' budget.json)
          PCT=$(jq -r '.budget_pct' budget.json)
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Today's spend: ${PCT}% of this loop's cap — ${REASON}"
          if [ "$MODE" = "exit" ]; then
            echo "::error::loop exited: ${REASON}"
            exit 1
          fi

      - name: Route
        run: |
          # 本 workflow 有意**不传 --target**（不参与 acting_on 锁）。
          # LOOP.md 的优先级表把 Release Drafter 列为"只读为主，可安全并发"，
          # 且它不写队列、不改代码——锁在这里只会让它被别人挡住，
          # 换不来任何保护。这是设计选择，不是漏改。
          # 参与锁的是那 4 个会落盘 work item 的循环，test.mjs 第 14 节按这条规则断言。
          node scripts/event-router.mjs --event push:tags > route.json
          cat route.json

      - name: Determine window
        id: window
        env:
          GH_TOKEN: ${{ secrets.LOOP_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV" ]; then
            echo "range=HEAD~30..HEAD" >> "$GITHUB_OUTPUT"
            echo "prev=none" >> "$GITHUB_OUTPUT"
          else
            echo "range=${PREV}..HEAD" >> "$GITHUB_OUTPUT"
            echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect merged PRs
        env:
          GH_TOKEN: ${{ secrets.LOOP_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # 同时扫 PR 和 main 上的直接提交——只扫 PR 会遗漏
          git log ${{ steps.window.outputs.range }} --oneline > direct-commits.txt || true
          echo "Direct commits in window:"
          cat direct-commits.txt

          gh pr list --state merged --limit 100 \
            --json number,title,labels,mergedAt > merged-prs.json || echo '[]' > merged-prs.json
          echo "Merged PRs: $(jq 'length' merged-prs.json)"

      - name: Emit draft skeleton
        run: |
          cat > RELEASE_NOTES_DRAFT.md <<'EOF'
          # Release Notes Draft

          <!-- Fill from merged PRs. Sections are fixed — do not invent new ones. -->

          ## Features
          -

          ## Bug Fixes
          -

          ## Performance
          -

          ## Breaking Changes
          -

          ## Security
          -

          ## Documentation
          -

          ## Internal / Chores
          -

          ---
          Review required before publishing.
          EOF
          echo "Draft written to RELEASE_NOTES_DRAFT.md"

      - name: Escalate if sensitive
        run: |
          cat <<'EOF'
          Escalate to human (always) when the window contains:
            - a major version bump
            - breaking changes
            - security-related entries
            - marketing-sensitive content
            - more than ~50 entries

          This workflow never publishes, never tags, never writes CHANGELOG.
          EOF

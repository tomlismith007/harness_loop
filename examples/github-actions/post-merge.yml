name: Loop — Post-Merge Cleanup

# 合并到 main → post-merge 阶段。扫描跟进项，不阻塞合并本身。
# 非高峰运行，限制每日自动 PR 数。

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: loop-post-merge
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.merged == true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Budget & kill switch
        id: budget
        run: |
          set -euo pipefail
          # 预算与 kill switch 的唯一入口（scripts/budget-check.mjs）。
          # 每个循环有自己的上限（loop-budget.md），按 pattern 取——曾经用
          # Math.max(...caps) 取全表最大值，于是所有循环共用 CI Sweeper 的 500k，
          # 本循环花掉自身 83% 时被算成 50%，判定"正常"。
          #
          # 注意本 workflow 不写 loop-run-log.md，而那是 budget-check 的唯一数据源，
          # 所以 used 目前恒为 0——预算百分比要等 agent 平台把真实花费写进 run-log
          # 才有意义。这里接线的主要收益是 **kill switch**（那部分是立即生效的）。
          node scripts/budget-check.mjs --pattern post-merge-cleanup --json > budget.json || true
          cat budget.json
          # fail-closed：脚本崩溃时 budget.json 是空的，jq 得到 "null"，
          # 而 "null" != "exit" —— 循环会在没有预算检查的情况下继续跑。
          # 一个失效的闸门和一个不存在的闸门在退出码上不可区分，所以显式拒绝。
          if ! jq -e '.mode' budget.json > /dev/null 2>&1; then
            echo "::error::budget-check produced no usable result — refusing to run unguarded"
            exit 1
          fi
          MODE=$(jq -r '.mode' budget.json)
          REASON=$(jq -r '.reason' budget.json)
          PCT=$(jq -r '.budget_pct' budget.json)
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Today's spend: ${PCT}% of this loop's cap — ${REASON}"
          if [ "$MODE" = "exit" ]; then
            echo "::error::loop exited: ${REASON}"
            exit 1
          fi

      - name: Route
        id: route
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # 锁键 = acting_on = 正在操作的目标资源。对 post-merge 来说是被合并的那个 PR。
          # 省略 --target 时 event-router 不做冲突检测，"同一分支每小时最多一个循环修改"
          # 静默失效（实测：传 --target 得到 conflict=lock-held，不传则字段不存在）。
          node scripts/event-router.mjs \
            --event pull_request.closed:merged \
            --item "pr-${PR_NUMBER}" \
            --target "pr-${PR_NUMBER}" > route.json
          cat route.json
          # 锁被别的循环持有 → 本轮 no-op，不落盘 work item。
          CONFLICT="$(jq -r '.conflict // "none"' route.json)"
          echo "conflict=$CONFLICT" >> "$GITHUB_OUTPUT"
          if [ "$CONFLICT" = "lock-held" ]; then
            echo "::warning::lock-held — skipping this run (outcome=no-op)"
          fi

      - name: Scan merged diff for follow-up work
        id: scan
        env:
          # sha 是十六进制串，但仍走 env：统一规则比逐个字段判断安全性可靠。
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          # 用 API 的合并列表而不是仅本地 git log，避免遗漏
          git diff --name-only "$BASE" "$HEAD" > merged-files.txt || true
          echo "files=$(wc -l < merged-files.txt)" >> "$GITHUB_OUTPUT"

          # 扫描新增的 TODO/FIXME/HACK
          git diff "$BASE" "$HEAD" | grep -E '^\+.*(TODO|FIXME|HACK|XXX)' > new-markers.txt || true
          echo "markers=$(wc -l < new-markers.txt)" >> "$GITHUB_OUTPUT"

          echo "New debt markers introduced by this merge:"
          cat new-markers.txt

      - name: Classify and propose
        run: |
          cat <<'EOF'
          Classify each finding:
            small + low risk   → propose fix in an isolated worktree
            large / design     → file a ticket, do not attempt
            external API impact → escalate to human
            already failed twice → escalate to human

          Cleanup must not change behavior. Verifier runs the full test suite.
          Cleanup PR touching > 10 files requires human approval before merge.
          Run off-peak. Limit to <= 2 automatic PRs per day.
          EOF

      # 锁被别的循环持有 → 不落盘 work item，本轮是 no-op。
      - name: Record work item
        if: steps.route.outputs.conflict != 'lock-held'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          MARKERS: ${{ steps.scan.outputs.markers }}
        run: |
          set -euo pipefail
          mkdir -p .loop/queue
          ITEM="post-merge-pr-${PR_NUMBER}"
          # 全部经 jq 编码，绝不拼进 JSON 字面量。
          cat > ".loop/queue/${ITEM}.json" <<EOF
          {
            "id": $(jq -Rn --arg v "$ITEM" '$v'),
            "event": "pull_request.closed:merged",
            "phase": "post-merge",
            "skills": ["post-merge-cleanup"],
            "merged_sha": $(jq -Rn --arg v "$MERGED_SHA" '$v'),
            "new_markers": ${MARKERS:-0},
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      # runner 文件系统是临时的：不上传的话 job 结束即消失，轮询 .loop/queue/ 永远看不到。
      - name: Upload work item
        if: always() && steps.route.outputs.conflict != 'lock-held'
        uses: actions/upload-artifact@v4
        with:
          name: loop-queue-post-merge-pr-${{ github.event.pull_request.number }}
          path: .loop/queue/
          retention-days: 7

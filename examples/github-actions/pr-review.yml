name: Loop — PR Review Triage

# PR 事件 → review 阶段（triage）或 fix 阶段（要求修改）。
# 不自动合并。fix 阶段只提出修复，由独立 verifier 验证。

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, closed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  checks: read

concurrency:
  # 同一分支每小时最多一个循环修改
  group: loop-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 跳过机器人自己的 PR，避免循环触发自己
    if: github.actor != 'loop-bot'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine event
        id: ev
        env:
          # 事件字段经 env 传入，绝不出现在 run: 的脚本正文里。
          # `head.ref`（分支名）是攻击者可控的，它此前被直接拼进 run: 正文，
          # 也会作为文件名写进 .loop/queue/。
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_ACTION: ${{ github.event.action }}
          GH_REVIEW_STATE: ${{ github.event.review.state }}
          GH_MERGED: ${{ github.event.pull_request.merged }}
          RAW_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          PR="$(printf '%s' "$RAW_PR" | tr -c '0-9' '-' | cut -c1-20)"
          if [ "$GH_EVENT_NAME" = "pull_request_review" ]; then
            if [ "$GH_REVIEW_STATE" = "changes_requested" ]; then
              EVENT="pull_request_review.changes_requested"
            elif [ "$GH_REVIEW_STATE" = "approved" ]; then
              EVENT="pull_request_review.approved"
            else
              EVENT="pull_request.opened"
            fi
          elif [ "$GH_ACTION" = "closed" ]; then
            if [ "$GH_MERGED" = "true" ]; then
              EVENT="pull_request.closed:merged"
            else
              EVENT="pull_request.closed:unmerged"
            fi
          elif [ "$GH_ACTION" = "ready_for_review" ]; then
            EVENT="pull_request.ready_for_review"
          elif [ "$GH_ACTION" = "synchronize" ]; then
            EVENT="pull_request.synchronize"
          else
            EVENT="pull_request.opened"
          fi
          echo "event=$EVENT" >> "$GITHUB_OUTPUT"
          echo "item=pr-$PR" >> "$GITHUB_OUTPUT"

      - name: Route
        id: route
        env:
          ROUTE_EVENT: ${{ steps.ev.outputs.event }}
          ROUTE_ITEM: ${{ steps.ev.outputs.item }}
          # 锁键 = acting_on = 正在操作的目标资源。对 PR 循环来说就是 PR 号。
          # 省略 --target 时 event-router 不做冲突检测，直接返回路由结果——
          # "同一分支每小时最多一个循环修改"就静默失效了（实测：传 --target 得到
          # conflict=lock-held，不传则 conflict 字段不存在）。
          ROUTE_TARGET: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node scripts/event-router.mjs \
            --event "$ROUTE_EVENT" \
            --item "$ROUTE_ITEM" \
            --target "$ROUTE_TARGET" \
            --state STATE.md > route.json
          cat route.json
          # 锁被别的循环持有时跳过本轮，记 no-op（LOOP.md 的冲突避免机制）。
          # 此前没有任何 workflow 读这个字段——只加 --target 而不消费它，
          # 锁等于不存在：work item 照样落盘，没人看到冲突。
          CONFLICT="$(jq -r '.conflict // "none"' route.json)"
          echo "conflict=$CONFLICT" >> "$GITHUB_OUTPUT"
          echo "held_by=$(jq -r '.held_by // "—"' route.json)" >> "$GITHUB_OUTPUT"
          if [ "$CONFLICT" = "lock-held" ]; then
            echo "::warning::lock-held — skipping this run (outcome=no-op)"
          fi

      # 锁被别的循环持有 → 不落盘 work item，本轮是 no-op。
      - name: Record work item
        if: steps.route.outputs.conflict != 'lock-held'
        env:
          ITEM: ${{ steps.ev.outputs.item }}
          EVENT: ${{ steps.ev.outputs.event }}
          RAW_URL: ${{ github.event.pull_request.html_url }}
          RAW_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          mkdir -p .loop/queue
          PHASE=$(jq -r '.phase' route.json)
          # 分支名只保留安全字符——它同时进文件名与 JSON。
          BRANCH="$(printf '%s' "$RAW_BRANCH" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-80)"
          cat > ".loop/queue/${ITEM}.json" <<EOF
          {
            "id": $(jq -Rn --arg v "$ITEM" '$v'),
            "event": $(jq -Rn --arg v "$EVENT" '$v'),
            "phase": $(jq -Rn --arg v "$PHASE" '$v'),
            "url": $(jq -Rn --arg v "$RAW_URL" '$v'),
            "branch": $(jq -Rn --arg v "$BRANCH" '$v'),
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Flag fix phase
        if: steps.ev.outputs.event == 'pull_request_review.changes_requested' && steps.route.outputs.conflict != 'lock-held'
        env:
          ITEM: ${{ steps.ev.outputs.item }}
        run: |
          echo "FIX PHASE — implementer and verifier must be separate agent instances."
          echo "Isolation: git worktree add loop/${ITEM}-attempt1"
          echo "Attempt limit: 3. Append each attempt to loop-ledger.json."
          echo "Denylist paths escalate without editing. See loop-constraints.md"

      # runner 文件系统是临时的：不上传的话 job 结束即消失，轮询 .loop/queue/ 永远看不到。
      # lock-held 时跳过上传——队列是空的，上传一个空目录只会让人以为跑过。
      - name: Upload work item
        if: always() && steps.route.outputs.conflict != 'lock-held'
        uses: actions/upload-artifact@v4
        with:
          name: loop-queue-pr-${{ github.event.pull_request.number }}
          path: .loop/queue/
          retention-days: 7

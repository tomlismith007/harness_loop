name: Loop — Merge Gate

# PR 转正 → gate 阶段。检查闸门并报告就绪度。
# 绝不合并。合并始终由人工执行。

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: read

concurrency:
  group: loop-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 跳过机器人自己触发的 PR，避免 gate 评论回灌循环
    if: github.actor != 'loop-bot'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect changed files
        id: files
        env:
          GH_TOKEN: ${{ secrets.LOOP_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr diff "$PR_NUMBER" --name-only > changed.txt
          echo "count=$(wc -l < changed.txt)" >> "$GITHUB_OUTPUT"
          cat changed.txt

      - name: Resolve reviewed commit
        id: rev
        env:
          GH_TOKEN: ${{ secrets.LOOP_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 约束 7：合并必须绑定审查过的 commit。
          # 取 PR 当前 head 与最近一次 APPROVED review 绑定的 commit；
          # 两者不一致时闸门会 escalate（审查后又 push 了）。
          HEAD_SHA="$(gh pr view "$PR_NUMBER" --json headRefOid -q .headRefOid)"
          # 取最后一条 review，并**要求它就是 APPROVED**。
          # 只取"最后一条 APPROVED"会让批准之后的 CHANGES_REQUESTED 被忽略；
          # 没有 APPROVED 时也绝不能回退成 head——那等于拿 head 与它自己比较，
          # 约束 7 的闸门必然通过。空值交给 gate-check 按 fail-closed 升级。
          REVIEWED_SHA="$(gh pr view "$PR_NUMBER" \
            --json reviews -q '[.reviews[]] | last | select(.state=="APPROVED") | .commit.oid // empty')"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "reviewed=$REVIEWED_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve red-check state
        id: red
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # 约束 8：回退测试。只认独占一行的标记；散文里提到不算。
          # 读不到就显式传 not-run——让"未跑"出现在输出里，而不是被静默省略。
          if printf '%s' "$PR_BODY" | grep -qE '^[[:space:]]*red-check:[[:space:]]*pass[[:space:]]*$'; then
            echo "state=pass" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$PR_BODY" | grep -qE '^[[:space:]]*red-check:[[:space:]]*fail[[:space:]]*$'; then
            echo "state=fail" >> "$GITHUB_OUTPUT"
          else
            echo "state=not-run" >> "$GITHUB_OUTPUT"
          fi

      - name: Check budget and kill switch
        id: budget
        run: |
          # 预算与 kill switch 的唯一入口。曾经这里是一段内联 node -e，
          # 用 Math.max(...caps) 取全表最大上限——于是所有循环共用 CI Sweeper 的
          # 500k，本循环花掉自身 83% 时被算成 50%，判定"正常"。
          node scripts/budget-check.mjs --pattern merge-gate --json > budget.json || true
          cat budget.json
          # fail-closed：`|| true` 吞掉退出码之后，脚本崩溃会让 budget.json 为空，
          # jq 得到 "null"，而 "null" != "exit" —— 闸门会在**没有预算检查**的情况下
          # 继续跑，输出看起来完全正常。一个失效的闸门和一个不存在的闸门
          # 在退出码上不可区分（硬约束 11）。所以这里显式拒绝。
          if ! jq -e '.mode' budget.json > /dev/null 2>&1; then
            echo "::error::budget-check produced no usable result — refusing to run unguarded"
            exit 1
          fi
          PCT=$(jq -r '.budget_pct' budget.json)
          MODE=$(jq -r '.mode' budget.json)
          REASON=$(jq -r '.reason' budget.json)
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Today's spend: ${PCT}% of this loop's cap — ${REASON}"
          if [ "$MODE" = "exit" ]; then
            echo "::error::loop exited: ${REASON}"
            exit 1
          fi

      - name: Fetch verifier report
        id: verifier
        env:
          GH_TOKEN: ${{ secrets.LOOP_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # 报告作者的登录名。用 LOOP_BOT_TOKEN 时是机器人账号；回退到
          # GITHUB_TOKEN 时是 github-actions[bot]——两者必须显式区分，
          # 否则作者过滤会把真实报告也挡掉，或把伪造报告放进来。
          LOOP_BOT_LOGIN: ${{ vars.LOOP_BOT_LOGIN || 'loop-bot' }}
        run: |
          # verifier 的产出以带标记的 PR 评论形式存在，**绝不从检出目录读取**。
          # 此前读的是工作区里的 verifier-report.md，而实现者可以把任何文件
          # 提交进 PR——闸门照收。只有 bot 账号能发这条评论，所以它是实现者
          # 无法伪造的来源。
          set -euo pipefail
          REPORT="$RUNNER_TEMP/verifier-report.md"
          # 只接受 bot 账号发的报告。此前只按标记取"最后一条评论"，
          # 于是 PR 作者（或任何能评论的人）可以伪造一条 APPROVE 覆盖真实报告。
          BOT_LOGIN="${LOOP_BOT_LOGIN:-loop-bot}"
          gh pr view "$PR_NUMBER" --json comments \
            | jq -r --arg bot "$BOT_LOGIN" \
              '[.comments[] | select(.author.login == $bot) | select(.body | startswith("<!-- loop-verifier-report -->"))] | last | .body // ""' \
            > "$REPORT.raw"
          if [ ! -s "$REPORT.raw" ] || [ "$(cat "$REPORT.raw")" = "null" ]; then
            echo "verdict=awaiting" >> "$GITHUB_OUTPUT"
            echo "No verifier report on this PR yet — merge is blocked pending verification."
            exit 0
          fi
          sed '1d' "$REPORT.raw" > "$REPORT"
          VERDICT="$(grep -m1 -oE 'APPROVE|REJECT|ESCALATE_HUMAN' "$REPORT" || echo awaiting)"
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "evidence=$REPORT" >> "$GITHUB_OUTPUT"

      - name: Run gate check
        id: gate
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUDGET_PCT: ${{ steps.budget.outputs.pct }}
          REVIEWED_SHA: ${{ steps.rev.outputs.reviewed }}
          HEAD_SHA: ${{ steps.rev.outputs.head }}
          RED_CHECK: ${{ steps.red.outputs.state }}
          VERDICT: ${{ steps.verifier.outputs.verdict }}
          EVIDENCE_FILE: ${{ steps.verifier.outputs.evidence }}
        run: |
          # 参数不可省，省掉会让对应闸门失效或必然升级：
          #   --reviewed-sha/--head-sha → 约束 7（TOCTOU）
          #   --red-check               → 约束 8（回退测试）
          #   --evidence-file           → verdict 是断言，不是证据
          #
          # verdict 来自 verifier 的产出，不再硬编码。此前这里写死 `--verdict none`，
          # 而规则 9 是 "verdict none + gate 阶段 → escalate"，于是这个 workflow
          # **从未放行过任何 PR**——每个 ready_for_review 都收到同一条升级，
          # 而持续假升级会训练人忽略它（文件自己的注释就这么写着）。
          EVIDENCE=""
          if [ -n "$EVIDENCE_FILE" ]; then EVIDENCE="--evidence-file $EVIDENCE_FILE"; fi
          if [ -z "$VERDICT" ] || [ "$VERDICT" = "awaiting" ]; then
            # 没验 ≠ 验失败。闸门自己会把这条报成 gate: "awaiting-verification"，
            # 所以这里只传 none，不重写结果——调用方改写闸门输出会让
            # "闸门说了什么"与"报告显示了什么"变成两份真相源。
            echo "::warning::No verifier verdict on this PR — awaiting verification, not a failure."
            VERDICT="none"
          fi
          # gate-check 的退出码是判定的一部分（0 proceed / 2 escalate / 3 exit），
          # 不是"脚本坏了"。`set -e` 会让 escalate 直接中断整个步骤，后面的
          # 评论与 Fail if escalated 全被跳过——真实演练里就是这样：PR 上
          # 没有任何闸门输出，人只看到一个红色 job。所以显式接住退出码。
          set +e
          node scripts/gate-check.mjs \
            --item "pr-${PR_NUMBER}" \
            --phase gate \
            --diff-files @changed.txt \
            --verdict "$VERDICT" \
            --budget-pct "$BUDGET_PCT" \
            --reviewed-sha "$REVIEWED_SHA" \
            --head-sha "$HEAD_SHA" \
            --red-check "$RED_CHECK" \
            $EVIDENCE > gate.json
          GATE_EXIT=$?
          set -e
          cat gate.json
          # 参数错误（1）不是判定，必须让 job 失败；判定类退出码交给后续步骤。
          if [ "$GATE_EXIT" = "1" ]; then
            echo "::error::gate-check rejected its arguments — the gate did not run"
            exit 1
          fi

      - name: Report readiness
        env:
          GH_TOKEN: ${{ secrets.LOOP_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUDGET_PCT: ${{ steps.budget.outputs.pct }}
          FILES_COUNT: ${{ steps.files.outputs.count }}
        run: |
          DECISION=$(jq -r '.decision' gate.json)
          REASON=$(jq -r '.reason' gate.json)
          GATE=$(jq -r '.gate // "none"' gate.json)

          BODY=$(cat <<EOF
          ## 🤖 Loop Harness — Merge Gate

          | Check | Result |
          |---|---|
          | Decision | \`${DECISION}\` |
          | Gate | \`${GATE}\` |
          | Files changed | ${FILES_COUNT} |
          | Budget today | ${BUDGET_PCT}% |

          **Reason:** ${REASON}

          > Merge is a human decision. This bot does not merge.
          EOF
          )
          gh pr comment "$PR_NUMBER" --body "$BODY"

      - name: Fail if escalated
        run: |
          DECISION=$(jq -r '.decision' gate.json)
          if [ "$DECISION" = "escalate" ]; then
            echo "::error::Gate escalated — human decision required"
            exit 1
          fi
          if [ "$DECISION" = "exit" ]; then
            echo "::error::Loop exited — kill switch or budget cap"
            exit 1
          fi

name: Loop — Lesson Harvest (nightly)

# 夜审循环：每天扫当天 commit，把教训写进 LESSONS.md。
# 不在事件脊上——它需要看到完整的一天，而不是单个事件。

on:
  schedule:
    - cron: '0 3 * * *'   # 每天凌晨 3 点
  workflow_dispatch:

permissions:
  contents: write      # 需要提交 LESSONS.md 更新
  pull-requests: read
  issues: read

concurrency:
  group: loop-lesson-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Budget & kill switch
        id: budget
        run: |
          set -euo pipefail
          # 预算与 kill switch 的唯一入口（scripts/budget-check.mjs）。
          # 此前这里是两段内联逻辑，两个问题：
          #   1. 预算用 Math.max(...caps) 取全表最大上限，于是本循环花掉自身
          #      83% 时被算成 50%，判定"正常"。
          #   2. 数 run-log 的正则是 /\{.*\}/g——不带 s/m 标志，而 run-log 的记录
          #      是跨多行的 JSON，于是**一条都匹配不上**，预算恒为 0%。
          # 另外内联版只查 STATE.md 的 kill switch；budget-check 同时查
          # STATE.md 与 loop-constraints.md 两处。
          node scripts/budget-check.mjs --pattern lesson-harvest --json > budget.json || true
          cat budget.json
          # fail-closed：脚本崩溃时 budget.json 是空的，jq 会得到 "null"，
          # 而 "null" != "exit" —— 于是循环在没有预算检查的情况下继续跑。
          # 一个失效的闸门和一个不存在的闸门在退出码上不可区分，所以这里必须显式拒绝。
          if ! jq -e '.mode' budget.json > /dev/null 2>&1; then
            echo "::error::budget-check produced no usable result — refusing to run unguarded"
            exit 1
          fi
          PCT=$(jq -r '.budget_pct' budget.json)
          MODE=$(jq -r '.mode' budget.json)
          REASON=$(jq -r '.reason' budget.json)
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Today's spend: ${PCT}% of this loop's cap — ${REASON}"
          if [ "$MODE" = "exit" ]; then
            echo "::error::loop exited: ${REASON}"
            exit 1
          fi
          if [ "$MODE" = "report-only" ]; then
            echo "::warning::budget at ${PCT}% — report-only mode"
          fi

      - name: Collect the day's commits
        run: |
          mkdir -p .loop/nightly
          git log --since="24 hours ago" --pretty=format:"%h|%ad|%s" --date=short > .loop/nightly/commits.txt || true
          echo "Commits in the last 24h: $(wc -l < .loop/nightly/commits.txt)"
          cat .loop/nightly/commits.txt

      - name: Detect rework signals
        run: |
          # 同一 issue 号在多个 commit 里出现 = 返工信号
          git log --since="7 days ago" --pretty=format:"%s" \
            | grep -oE '#[0-9]+' | sort | uniq -c | sort -rn \
            | awk '$1 >= 2' > .loop/nightly/rework-candidates.txt || true
          echo "Issues touched more than once in 7 days:"
          cat .loop/nightly/rework-candidates.txt

      - name: Detect reverts (should not have merged)
        run: |
          git log --since="24 hours ago" --pretty=format:"%h %s" \
            | grep -iE '^[0-9a-f]+ revert|revert "' > .loop/nightly/reverts.txt || true
          echo "Reverts in the last 24h:"
          cat .loop/nightly/reverts.txt

      - name: Detect thin verification
        run: |
          # PR 评论里出现 "not run" 是验证不缜密的信号
          echo "Look for PR bodies/comments containing 'not run' — thin verification signal."
          echo "Also check: tests that only went green after the fix was merged."

      - name: Emit review skeleton
        run: |
          cat > .loop/nightly/REVIEW.md <<EOF
          ## Nightly Review — $(date -u +%Y-%m-%d)

          ### Scanned
          - Commits: $(wc -l < .loop/nightly/commits.txt 2>/dev/null || echo 0)
          - Reverts: $(wc -l < .loop/nightly/reverts.txt 2>/dev/null || echo 0)
          - Rework candidates: $(wc -l < .loop/nightly/rework-candidates.txt 2>/dev/null || echo 0)

          ### Rework detected
          | Issue | Times fixed | Pattern |
          |---|---|---|
          -

          ### Should not have merged
          -

          ### Thin verification
          -

          ### Lessons added
          1. <rule> — Seen 1x (<date>) — Evidence: <ref>

          ### Promoted this run
          - <rule> -> loop-constraints.md (Seen 3x: ...)

          ### Done right
          -

          ### Skipped
          -
          EOF
          cat .loop/nightly/REVIEW.md

      - name: Remind about promotion threshold
        run: |
          cat <<'EOF'
          Promotion rule: a lesson seen on 3 DIFFERENT days moves from LESSONS.md
          into loop-constraints.md, becoming a hard rule that every PR review checks.

          Do not promote early. Seen 1x is Seen 1x — promoting on a single occurrence
          pollutes the hard-rule set with noise.

          After promoting, confirm the downstream picked it up:
            - loop-verifier checklist includes the new rule
            - minimal-fix constraints include the new rule
          A rule in the constraints file that the verifier never reads was never promoted.
          EOF

      - name: Append run log
        run: |
          cat >> loop-run-log.md <<EOF
          {"run_id":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","pattern":"lesson-harvest","event":"schedule","item":"nightly","level":"L1","duration_s":0,"items_found":0,"actions_taken":0,"escalations":0,"tokens_estimate":40000,"outcome":"report-only"}
          EOF

      # runner 文件系统是临时的：追加进 loop-run-log.md 的记录不上传就随 job 消失。
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-run-log-lesson-harvest
          path: loop-run-log.md
          retention-days: 7

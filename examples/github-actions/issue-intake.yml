name: Loop — Issue Intake

# 把 issue 事件路由到 intake 阶段，产出 work item。
# 不执行 agent 逻辑——只路由并落盘。

on:
  issues:
    types: [opened, reopened, labeled]

# 最小权限：只读仓库，写 issue（comment/label）
permissions:
  contents: read
  issues: write

concurrency:
  group: loop-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  route:
    # 跳过机器人自己的打标签：agent 应用 area:*/needs-* 会再次触发 issues.labeled，
    # 形成自触发环路（pr-review.yml 有同样的守卫）。
    if: github.actor != 'loop-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Route the event
        id: route
        env:
          # 事件字段经 env 传入，绝不出现在 run: 的脚本正文里。
          # 直接插值等于把攻击者可控的字段拼进 shell——`issue.title` 里的
          # `"; cmd; "` 会被真的执行（本地模拟已复现）。
          RAW_ACTION: ${{ github.event.action }}
          RAW_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # action 与 number 都是枚举/数字，仍消毒一次：item 会进文件名与 $GITHUB_OUTPUT。
          ACTION="$(printf '%s' "$RAW_ACTION" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-40)"
          ITEM="issue-$(printf '%s' "$RAW_NUMBER" | tr -c '0-9' '-' | cut -c1-20)"
          # 锁键 = acting_on = 正在操作的目标资源。对 issue 循环来说就是 issue 号。
          # 省略 --target 时 event-router 不做冲突检测，"同一分支每小时最多一个循环修改"
          # 静默失效（实测：传 --target 得到 conflict=lock-held，不传则字段不存在）。
          TARGET="$(printf '%s' "$RAW_NUMBER" | tr -c '0-9' '-' | cut -c1-20)"
          echo "event=issues.${ACTION}" >> "$GITHUB_OUTPUT"
          echo "item=${ITEM}" >> "$GITHUB_OUTPUT"
          node scripts/event-router.mjs \
            --event "issues.${ACTION}" \
            --item "$ITEM" \
            --target "issue-${TARGET}" > route.json
          cat route.json
          # 锁被别的循环持有 → 本轮 no-op，不落盘 work item。
          CONFLICT="$(jq -r '.conflict // "none"' route.json)"
          echo "conflict=$CONFLICT" >> "$GITHUB_OUTPUT"
          if [ "$CONFLICT" = "lock-held" ]; then
            echo "::warning::lock-held — skipping this run (outcome=no-op)"
          fi

      # 锁被别的循环持有 → 不落盘 work item，本轮是 no-op。
      - name: Record work item
        if: steps.route.outputs.conflict != 'lock-held'
        env:
          ITEM: ${{ steps.route.outputs.item }}
          EVENT: ${{ steps.route.outputs.event }}
          RAW_TITLE: ${{ github.event.issue.title }}
          RAW_URL: ${{ github.event.issue.html_url }}
        run: |
          set -euo pipefail
          mkdir -p .loop/queue
          # title 与 url 都是自由文本/任意 URL：一律经 jq 编码，绝不拼进 JSON 字面量。
          cat > ".loop/queue/${ITEM}.json" <<EOF
          {
            "id": $(jq -Rn --arg v "$ITEM" '$v'),
            "event": $(jq -Rn --arg v "$EVENT" '$v'),
            "phase": "intake",
            "skills": ["issue-triage"],
            "level": "L1",
            "title": $(jq -Rn --arg v "$RAW_TITLE" '$v'),
            "url": $(jq -Rn --arg v "$RAW_URL" '$v'),
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat ".loop/queue/${ITEM}.json"

      - name: Note L1 report-only
        if: steps.route.outputs.conflict != 'lock-held'
        run: |
          echo "L1: propose labels only. Do not apply labels, comment, or close."
          echo "See skills/issue-triage/SKILL.md"

      # runner 文件系统是临时的：job 结束文件就消失，轮询 .loop/queue 的 agent
      # 平台永远看不到任何东西。必须显式交付出去，事件脊才不会在 runner 边界终止。
      - name: Upload work item
        if: always() && steps.route.outputs.conflict != 'lock-held'
        uses: actions/upload-artifact@v4
        with:
          name: loop-queue-issue-${{ github.event.issue.number }}
          path: .loop/queue/
          retention-days: 7

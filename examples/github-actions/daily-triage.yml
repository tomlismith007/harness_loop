name: Loop — Daily Triage (fallback)

# 定时兜底：事件丢失时的每日概览。
# 工作日 08:00 运行。高节奏循环的经济性依赖提前退出——本 workflow 每天只跑一次。

on:
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: loop-daily-triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Budget & kill switch
        id: budget
        run: |
          set -euo pipefail
          # 预算与 kill switch 的唯一入口（scripts/budget-check.mjs）。
          # 此前这里是两段内联逻辑，两个问题：
          #   1. 预算用 Math.max(...caps) 取全表最大上限，于是本循环花掉自身
          #      83% 时被算成 50%，判定"正常"。
          #   2. 数 run-log 的正则是 /\{.*\}/g——不带 s/m 标志，而 run-log 的记录
          #      是跨多行的 JSON，于是**一条都匹配不上**，预算恒为 0%。
          # 另外内联版只查 STATE.md 的 kill switch；budget-check 同时查
          # STATE.md 与 loop-constraints.md 两处。
          node scripts/budget-check.mjs --pattern daily-triage --json > budget.json || true
          cat budget.json
          # fail-closed：脚本崩溃时 budget.json 是空的，jq 会得到 "null"，
          # 而 "null" != "exit" —— 于是循环在没有预算检查的情况下继续跑。
          # 一个失效的闸门和一个不存在的闸门在退出码上不可区分，所以这里必须显式拒绝。
          if ! jq -e '.mode' budget.json > /dev/null 2>&1; then
            echo "::error::budget-check produced no usable result — refusing to run unguarded"
            exit 1
          fi
          PCT=$(jq -r '.budget_pct' budget.json)
          MODE=$(jq -r '.mode' budget.json)
          REASON=$(jq -r '.reason' budget.json)
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Today's spend: ${PCT}% of this loop's cap — ${REASON}"
          if [ "$MODE" = "exit" ]; then
            echo "::error::loop exited: ${REASON}"
            exit 1
          fi
          if [ "$MODE" = "report-only" ]; then
            echo "::warning::budget at ${PCT}% — report-only mode"
          fi

      - name: Gather signals
        env:
          GH_TOKEN: ${{ secrets.LOOP_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .loop/daily
          gh issue list --state open --limit 50 --json number,title,labels,createdAt > .loop/daily/issues.json || echo '[]' > .loop/daily/issues.json
          gh pr list --state open --limit 50 --json number,title,isDraft,reviewDecision,createdAt > .loop/daily/prs.json || echo '[]' > .loop/daily/prs.json
          echo "Open issues: $(jq 'length' .loop/daily/issues.json)"
          echo "Open PRs:    $(jq 'length' .loop/daily/prs.json)"

      - name: Emit triage skeleton
        run: |
          cat > .loop/daily/TRIAGE.md <<EOF
          Last run: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Mode: ${{ steps.budget.outputs.mode }}

          ## High-Priority Items (act on these)
          -

          ## Watch Items (monitor, do not act yet)
          -

          ## Noise / Ignore
          -

          ## State Updates
          -
          EOF
          cat .loop/daily/TRIAGE.md

      - name: Append run log
        run: |
          cat >> loop-run-log.md <<EOF
          {"run_id":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","pattern":"daily-triage","event":"schedule","item":"daily","level":"L1","duration_s":0,"items_found":0,"actions_taken":0,"escalations":0,"tokens_estimate":5000,"outcome":"report-only"}
          EOF

      # runner 文件系统是临时的：追加进 loop-run-log.md 的记录不上传就随 job 消失。
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-run-log-daily-triage
          path: loop-run-log.md
          retention-days: 7

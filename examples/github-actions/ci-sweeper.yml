name: Loop — CI Sweeper

# CI 失败 → fix 阶段。先分类（flake/regression/env/config），只有 regression 可操作。
# 环境失败必须升级，绝不用代码"修复"。

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  check_suite:
    types: [completed]

permissions:
  contents: read
  checks: read
  pull-requests: write

concurrency:
  group: loop-ci-${{ github.event.workflow_run.head_branch || github.event.check_suite.head_branch }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 只在失败时处理
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure') ||
      (github.event_name == 'check_suite' && github.event.check_suite.conclusion == 'failure')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Budget & kill switch
        id: budget
        run: |
          set -euo pipefail
          # 预算与 kill switch 的唯一入口（scripts/budget-check.mjs）。
          # 每个循环有自己的上限（loop-budget.md），按 pattern 取——曾经用
          # Math.max(...caps) 取全表最大值，于是所有循环共用 CI Sweeper 的 500k，
          # 本循环花掉自身 83% 时被算成 50%，判定"正常"。
          #
          # 注意本 workflow 不写 loop-run-log.md，而那是 budget-check 的唯一数据源，
          # 所以 used 目前恒为 0——预算百分比要等 agent 平台把真实花费写进 run-log
          # 才有意义。这里接线的主要收益是 **kill switch**（那部分是立即生效的）。
          node scripts/budget-check.mjs --pattern ci-sweeper --json > budget.json || true
          cat budget.json
          # fail-closed：脚本崩溃时 budget.json 是空的，jq 得到 "null"，
          # 而 "null" != "exit" —— 循环会在没有预算检查的情况下继续跑。
          # 一个失效的闸门和一个不存在的闸门在退出码上不可区分，所以显式拒绝。
          if ! jq -e '.mode' budget.json > /dev/null 2>&1; then
            echo "::error::budget-check produced no usable result — refusing to run unguarded"
            exit 1
          fi
          MODE=$(jq -r '.mode' budget.json)
          REASON=$(jq -r '.reason' budget.json)
          PCT=$(jq -r '.budget_pct' budget.json)
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Today's spend: ${PCT}% of this loop's cap — ${REASON}"
          if [ "$MODE" = "exit" ]; then
            echo "::error::loop exited: ${REASON}"
            exit 1
          fi

      # 事件不能写死：本 workflow 同时订阅 workflow_run 与 check_suite，
      # 写死成 check_suite.* 会让 workflow_run.* 路由永远不可达，并套用错误的闸门集。
      - name: Determine event
        id: ev
        env:
          # 事件字段经 env 传入，绝不出现在 run: 的脚本正文里。
          # 直接插值等于把攻击者可控的值拼进 shell——`github.event_name` 本身是
          # 受控枚举，但同一条规则统一适用于所有事件字段，避免"这条安全那条不安全"。
          GH_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$GH_EVENT_NAME" = "workflow_run" ]; then
            EVENT="workflow_run.completed:failure"
          else
            EVENT="check_suite.completed:failure"
          fi
          echo "event=$EVENT" >> "$GITHUB_OUTPUT"

      - name: Resolve item
        id: item
        env:
          # head_branch 是攻击者可控的分支名。它此前被直接拼进 run: 正文，
          # 而分支名里的 `"; cmd; "` 会被真的执行（本地模拟已复现），
          # 并会作为文件名写进 .loop/queue/（`../../` 可越权）。
          RAW_BRANCH: ${{ github.event.workflow_run.head_branch || github.event.check_suite.head_branch }}
          RAW_SHA: ${{ github.event.workflow_run.head_sha || github.event.check_suite.head_sha }}
        run: |
          set -euo pipefail
          # 只保留安全字符；其余替换为 '-'。item 会进文件名与 $GITHUB_OUTPUT。
          BRANCH="$(printf '%s' "$RAW_BRANCH" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-80)"
          SHORT="$(printf '%s' "$RAW_SHA" | tr -c '0-9a-fA-F' '-' | cut -c1-7)"
          echo "item=ci-${SHORT}-${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "sha=${RAW_SHA}" >> "$GITHUB_OUTPUT"

      - name: Route
        id: route
        env:
          ROUTE_EVENT: ${{ steps.ev.outputs.event }}
          ROUTE_ITEM: ${{ steps.item.outputs.item }}
          # 锁键 = acting_on = 正在操作的目标资源。对 CI 循环来说就是分支名。
          # 用的是已消毒的 BRANCH（不是原始 RAW_BRANCH）——锁键会与 STATE.md 的
          # acting_on 列做 === 比较，两边必须逐字一致。
          ROUTE_TARGET: ${{ steps.item.outputs.branch }}
        run: |
          set -euo pipefail
          node scripts/event-router.mjs \
            --event "$ROUTE_EVENT" \
            --item "$ROUTE_ITEM" \
            --target "$ROUTE_TARGET" \
            --state STATE.md > route.json
          cat route.json
          # "CI Sweeper 已在修某分支时 PR Review 不重复修"正是这条锁唯一该起作用的场景。
          CONFLICT="$(jq -r '.conflict // "none"' route.json)"
          echo "conflict=$CONFLICT" >> "$GITHUB_OUTPUT"
          echo "held_by=$(jq -r '.held_by // "—"' route.json)" >> "$GITHUB_OUTPUT"
          if [ "$CONFLICT" = "lock-held" ]; then
            echo "::warning::lock-held — skipping this run (outcome=no-op)"
          fi

      - name: Classify guidance
        run: |
          cat <<'EOF'
          Classify before acting:
            flake      → intermittent, passed on retry without code change → Watch, DO NOT fix
            regression → new failure correlated with a recent commit        → actionable
            env        → runner, registry, secrets, quota                   → ESCALATE, never fix with code
            config     → workflow, dependency install, cache                → human judgment

          Before each retry:
            node scripts/ledger-check.mjs --ledger loop-ledger.json
            exit code 2 → STOP, escalate to human
          EOF

      # 锁被别的循环持有 → 不落盘 work item，本轮是 no-op。
      - name: Record work item
        if: steps.route.outputs.conflict != 'lock-held'
        env:
          ITEM: ${{ steps.item.outputs.item }}
          EVENT: ${{ steps.ev.outputs.event }}
          BRANCH: ${{ steps.item.outputs.branch }}
          SHA: ${{ steps.item.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p .loop/queue
          # 全部经 jq 编码，绝不拼进 JSON 字面量。
          cat > ".loop/queue/${ITEM}.json" <<EOF
          {
            "id": $(jq -Rn --arg v "$ITEM" '$v'),
            "event": $(jq -Rn --arg v "$EVENT" '$v'),
            "phase": "fix",
            "branch": $(jq -Rn --arg v "$BRANCH" '$v'),
            "sha": $(jq -Rn --arg v "$SHA" '$v'),
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Escalate on environment failure signal
        if: steps.route.outputs.conflict != 'lock-held'
        run: |
          # 环境类失败的典型信号——命中即标记人工处理
          echo "If the failure mentions: runner, registry, secret, quota, network, timeout-of-infra"
          echo "→ label the work item needs-human and do not attempt a code fix."

      # runner 文件系统是临时的：不上传的话 job 结束即消失，轮询 .loop/queue/ 永远看不到。
      # lock-held 时跳过上传——队列是空的，上传一个空目录只会让人以为跑过。
      - name: Upload work item
        if: always() && steps.route.outputs.conflict != 'lock-held'
        uses: actions/upload-artifact@v4
        with:
          name: loop-queue-ci-${{ steps.item.outputs.item }}
          path: .loop/queue/
          retention-days: 7

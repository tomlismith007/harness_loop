# Machine-readable pattern registry for loop-harness.
#
# defaults 段的阈值由 scripts/gate-check.mjs 与 scripts/ledger-check.mjs 读取
# （见 scripts/lib/common.mjs 的 readRegistryDefaults）——改这里的数字会真的改变
# 行为。CLI 参数可覆盖单项，--registry 可指向另一份文件。
#
# 每个 pattern 对应一条事件脊上的循环。新增循环时必须在此登记，
# 并在 LOOP.md 的路由表中声明对应事件。

version: 1

# 循环的机器可读定义只在 LOOP.md（登记表）与 scripts/event-router.mjs（ROUTES）里。
# 这里曾有一整段 `patterns:` 复制它们，却没有任何脚本读取——第三份真相源。
# 预算上限只在 loop-budget.md；阈值只在 scripts/budget-check.mjs 的常量里。

# ---- 三阶段建设模型 ----
#
# 阶段不是"做得更好"，而是"这几项检查全过才算完成"。
# 由 scripts/harness-stage.mjs 机械判定。

stages:
  - id: 1
    name: 初始化
    en: Init
    goal: 创建必要的 md 文件，让 harness 结构完整、下一会话可重启
    level: L1
    skill: harness-init
    mechanical_checks: 8
    human_checks: 0
    exit: 8 项判据全过，且启动脚本真的能跑通（退出码 0）
    grounding:
      - LHE 五子系统最小工件
      - LHE 给地图不给手册（AGENTS.md 约 100 行）
      - LEC 脚手架产物（STATE/LOOP/budget/run-log）
      - LEC 第一周只报告

  - id: 2
    name: 装配 loop 机制
    en: Loop Init
    goal: 装配 loop 机制文档，让验证真的有效、约束真的被强制执行
    level: L2
    skill: harness-loop-init
    produces:
      [LOOP.md, loop-budget.md, loop-run-log.md, session-handoff.md, loop-ledger.json]
    mechanical_checks: 6
    human_checks: 3
    exit: 6 项机械判据全过 + 三项人工确认（回退测试执行过 / NOT RUN 用过 / triage 准确率 > 70%）
    grounding:
      - LHE 受控消融测试
      - LHE 三层终止校验（语法→运行时→系统级）
      - LHE 架构规则可执行化 + what/why/fix 错误信息
      - LEC maker/checker 分离 + denylist + 熔断 3/5/10
      - magpie 回退测试 / NOT RUN / 真机验证

  - id: 3
    name: 巩固
    en: Consolidate
    goal: loop + harness 强化-巩固：事件接上、循环跑起来、经验自己积累并转正为规则
    level: L3
    skill: harness-consolidate
    mechanical_checks: 7
    human_checks: 1
    exit: 7 项机械判据全过 + 跑过完整循环周期（人工）
    grounding:
      - LHE 六原语 + 图工程多循环协调
      - LEC 事件驱动 + 多循环优先级 + 成本可观测
      - magpie 夜审 + LESSONS.md 棘轮 + 成本分层门卫

# ---- 全局约束 ----

defaults:
  max_attempts: 3
  max_files_per_fix: 5
  max_files_per_cleanup: 10
  breaker:
    stagnation: 3
    no_progress: 5
    max_iterations: 10
  auto_merge: false

# 以下键没有消费者，已删除：budget_report_only_pct / budget_exit_pct（阈值在
# budget-check.mjs）、merge_binding / red_check_required / not_run_must_be_listed
# （由 gate-check 的固定行为执行）、lesson_promotion_threshold /
# stage2_requires_triage_accuracy / ablation_interval（写在对应技能正文）。
# 冲突优先级只在 LOOP.md 的「多循环协调」章节；它没有代码消费者，不再复制一份。
